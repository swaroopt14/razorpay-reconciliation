# Allow zord-relay to call zord-edge and zord-intent-engine (dispatch callbacks)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-relay-to-services
  namespace: zord
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - zord-edge
          - zord-intent-engine
          - zord-outcome-engine
          - zord-evidence
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zord-relay
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8083
        - protocol: TCP
          port: 8088
