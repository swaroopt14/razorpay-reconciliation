# Allow only zord-prompt-layer to access Redis (session cache)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-access
  namespace: zord
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zord-prompt-layer-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zord-prompt-layer
      ports:
        - protocol: TCP
          port: 6379
