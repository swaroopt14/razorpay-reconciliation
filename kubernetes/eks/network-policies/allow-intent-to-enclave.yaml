# Allow zord-intent-engine to call zord-token-enclave (PII tokenization)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intent-to-enclave
  namespace: zord
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zord-token-enclave
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zord-intent-engine
      ports:
        - protocol: TCP
          port: 8087
