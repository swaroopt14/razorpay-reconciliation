# Allow Postgres and Kafka to resolve DNS (they need it for startup)
# But block them from making any other outbound calls
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-infrastructure
  namespace: zord
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - zord-postgres
          - zord-kafka
          - zord-prompt-layer-redis
  policyTypes:
    - Egress
  egress:
    # DNS only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kafka needs to talk to itself (controller quorum)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zord-kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
