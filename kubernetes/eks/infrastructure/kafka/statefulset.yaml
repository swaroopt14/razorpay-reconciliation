apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zord-kafka
spec:
  serviceName: zord-kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zord-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zord-kafka
    spec:
      securityContext:
        fsGroup: 1000
      priorityClassName: infra-critical
      tolerations:
        - key: workload
          value: stateful
          effect: NoSchedule
      nodeSelector:
        workload: stateful
      containers:
        - name: kafka
          image: 673698305621.dkr.ecr.ap-south-1.amazonaws.com/mirror/cp-kafka:7.6.0
          ports:
            - containerPort: 9092
              name: sasl
            - containerPort: 9093
              name: controller
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER

            # ── SASL/SCRAM Authentication ────────────────────────────────────
            - name: KAFKA_LISTENERS
              value: SASL_PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: SASL_PLAINTEXT://zord-kafka.zord.svc.cluster.local:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: SASL_PLAINTEXT
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: SCRAM-SHA-512
            - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: SCRAM-SHA-512

            # ── SCRAM credentials (inter-broker) ─────────────────────────────
            - name: KAFKA_LISTENER_NAME_SASL__PLAINTEXT_SCRAM__SHA__512_SASL_JAAS_CONFIG
              valueFrom:
                secretKeyRef:
                  name: zord-app-secrets
                  key: KAFKA_BROKER_JAAS_CONFIG

            # ── Topic governance ─────────────────────────────────────────────
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"

            # ── Retention (7 days default) ───────────────────────────────────
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "-1"

            # ── ACL enforcement ──────────────────────────────────────────────
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: org.apache.kafka.metadata.authorizer.StandardAuthorizer
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: "false"
            - name: KAFKA_SUPER_USERS
              value: "User:admin"

            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx1536m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
              subPath: kafka-data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 15
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
