# Creates SCRAM-SHA-512 users for each service.
# Run AFTER Kafka is ready and BEFORE deploying application services.
apiVersion: batch/v1
kind: Job
metadata:
  name: zord-kafka-scram-users
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: scram-setup
          image: 673698305621.dkr.ecr.ap-south-1.amazonaws.com/mirror/cp-kafka:7.6.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          envFrom:
            - secretRef:
                name: zord-kafka-secrets
          command:
            - /bin/bash
            - -ec
            - |
              BOOTSTRAP="zord-kafka:9092"

              echo "Waiting for Kafka..."
              until kafka-broker-api-versions --bootstrap-server $BOOTSTRAP >/dev/null 2>&1; do
                sleep 5
              done
              echo "Kafka is ready"

              echo "=== Creating SCRAM users ==="

              # Admin (super user — inter-broker)
              kafka-configs --bootstrap-server $BOOTSTRAP \
                --alter --add-config 'SCRAM-SHA-512=[password=admin-secure-password-change-me]' \
                --entity-type users --entity-name admin

              # Per-service users
              kafka-configs --bootstrap-server $BOOTSTRAP \
                --alter --add-config 'SCRAM-SHA-512=[password=relay-secure-password]' \
                --entity-type users --entity-name relay-service

              kafka-configs --bootstrap-server $BOOTSTRAP \
                --alter --add-config 'SCRAM-SHA-512=[password=edge-secure-password]' \
                --entity-type users --entity-name edge-service

              kafka-configs --bootstrap-server $BOOTSTRAP \
                --alter --add-config 'SCRAM-SHA-512=[password=intent-secure-password]' \
                --entity-type users --entity-name intent-service

              kafka-configs --bootstrap-server $BOOTSTRAP \
                --alter --add-config 'SCRAM-SHA-512=[password=outcome-secure-password]' \
                --entity-type users --entity-name outcome-service

              kafka-configs --bootstrap-server $BOOTSTRAP \
                --alter --add-config 'SCRAM-SHA-512=[password=evidence-secure-password]' \
                --entity-type users --entity-name evidence-service

              kafka-configs --bootstrap-server $BOOTSTRAP \
                --alter --add-config 'SCRAM-SHA-512=[password=intelligence-secure-password]' \
                --entity-type users --entity-name intelligence-service

              kafka-configs --bootstrap-server $BOOTSTRAP \
                --alter --add-config 'SCRAM-SHA-512=[password=ml-secure-password]' \
                --entity-type users --entity-name ml-service

              echo "=== All SCRAM users created ==="
