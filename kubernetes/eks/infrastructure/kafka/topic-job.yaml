# Declarative topic creation — all topics defined as code.
# auto.create.topics.enable=false means ONLY these topics exist.
apiVersion: batch/v1
kind: Job
metadata:
  name: zord-kafka-topics
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: 673698305621.dkr.ecr.ap-south-1.amazonaws.com/mirror/cp-kafka:7.6.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          command:
            - /bin/bash
            - -ec
            - |
              BOOTSTRAP="zord-kafka:9092"

              until kafka-topics --bootstrap-server $BOOTSTRAP --list >/dev/null 2>&1; do
                echo "waiting for kafka..."
                sleep 5
              done

              echo "=== Creating topics with governance ==="

              # ── Core event topics (7 day retention, 3 partitions) ──────────
              for topic in \
                payments.ledger.events.v1 \
                payments.intent.events.v1 \
                payments.dispatch.events.v1 \
                payments.outcome.events.v1 \
                evidence.pack.created \
                batch.canonicalization.completed \
                canonical.settlement.created \
                attachment.decision.created \
                variance.record.created \
                batch.summary.updated \
                governance.decision.created
              do
                kafka-topics --bootstrap-server $BOOTSTRAP \
                  --create --if-not-exists \
                  --topic "$topic" \
                  --partitions 3 \
                  --replication-factor 1 \
                  --config retention.ms=604800000 \
                  --config cleanup.policy=delete
              done

              # ── DLQ topics (30 day retention for investigation) ────────────
              for topic in \
                payments.intent.dlq \
                relay.dlq.publish_failure \
                relay.dlq.poison \
                dlq.event
              do
                kafka-topics --bootstrap-server $BOOTSTRAP \
                  --create --if-not-exists \
                  --topic "$topic" \
                  --partitions 3 \
                  --replication-factor 1 \
                  --config retention.ms=2592000000 \
                  --config cleanup.policy=delete
              done

              # ── Internal/operational topics (3 day retention) ──────────────
              for topic in \
                pii.tokenize.request \
                pii.tokenize.result \
                ml.request.events \
                ml.result.events \
                zpi.actuation.retry \
                zpi.actuation.evidence \
                zpi.actuation.alert \
                zpi.actuation.batch_patch \
                zord.vector.index.request.v1 \
                corridor.health.tick \
                sla.timer.tick
              do
                kafka-topics --bootstrap-server $BOOTSTRAP \
                  --create --if-not-exists \
                  --topic "$topic" \
                  --partitions 3 \
                  --replication-factor 1 \
                  --config retention.ms=259200000 \
                  --config cleanup.policy=delete
              done

              echo ""
              echo "=== Topic list ==="
              kafka-topics --bootstrap-server $BOOTSTRAP --list
              echo ""
              echo "=== Topic governance complete ==="
              echo "  Core topics: 7 day retention"
              echo "  DLQ topics: 30 day retention"
              echo "  Operational topics: 3 day retention"
              echo "  auto.create.topics.enable=false"
