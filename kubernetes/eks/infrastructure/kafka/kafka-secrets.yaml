# Kafka SASL/SCRAM credentials
# These are created via ExternalSecret from AWS Secrets Manager.
# Add the following keys to production/zord/app-secrets:
#   KAFKA_BROKER_JAAS_CONFIG = org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="<ADMIN_PASSWORD>";
#   KAFKA_RELAY_USERNAME = relay-service
#   KAFKA_RELAY_PASSWORD = <RELAY_PASSWORD>
#   KAFKA_EDGE_USERNAME = edge-service
#   KAFKA_EDGE_PASSWORD = <EDGE_PASSWORD>
#   KAFKA_INTENT_USERNAME = intent-service
#   KAFKA_INTENT_PASSWORD = <INTENT_PASSWORD>
#   KAFKA_OUTCOME_USERNAME = outcome-service
#   KAFKA_OUTCOME_PASSWORD = <OUTCOME_PASSWORD>
#   KAFKA_EVIDENCE_USERNAME = evidence-service
#   KAFKA_EVIDENCE_PASSWORD = <EVIDENCE_PASSWORD>
#   KAFKA_INTELLIGENCE_USERNAME = intelligence-service
#   KAFKA_INTELLIGENCE_PASSWORD = <INTELLIGENCE_PASSWORD>
#   KAFKA_ML_USERNAME = ml-service
#   KAFKA_ML_PASSWORD = <ML_PASSWORD>
---
apiVersion: v1
kind: Secret
metadata:
  name: zord-kafka-secrets
  annotations:
    description: "Kafka SASL/SCRAM credentials - managed via ExternalSecret"
type: Opaque
stringData:
  # Inter-broker auth (super user)
  KAFKA_BROKER_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="CHANGE_ME_IN_SECRETS_MANAGER";'
